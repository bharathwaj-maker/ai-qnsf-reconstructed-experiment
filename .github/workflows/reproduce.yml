name: Reproduce datasets and results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run_all.py"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/reproduce.yml"

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pinned dependencies and record runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import json, platform, numpy, pandas, sklearn
          from pathlib import Path
          path = Path("metadata/environment.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["python"] = platform.python_version()
          data["numpy"] = numpy.__version__
          data["pandas"] = pandas.__version__
          data["scikit_learn"] = sklearn.__version__
          data["execution_platform"] = platform.platform()
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Execute complete experiment
        run: python run_all.py

      - name: Verify generated archive
        run: python scripts/verify_archive.py

      - name: Commit generated datasets and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/dataset_manifest.json results/*.csv results/*.json metadata/environment.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Reproduce AI-QNSF datasets and evaluation outputs"
            git push
          fi
